name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mido-guard") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="target/$TARGET/release/mido"
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked' \
            || { echo "::error::$binary is not statically linked"; exit 1; }
          "$binary" --version | grep -q " $version\$" \
            || { echo "::error::$binary does not report version $version"; exit 1; }

      - name: Package the release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="mido-v${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/mido" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)

      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Compose the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for $version — using generated notes"
            rm -f notes.md
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.tar.gz dist/SHA256SUMS install.sh)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi
          args=(--verify-tag --title "$GITHUB_REF_NAME")
          if [ -f notes.md ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"

  publish:
    name: Publish to crates.io
    needs: release
    if: github.repository == 'alessandromalacarne/mido'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A mido-release-workflow \
            "https://crates.io/api/v1/crates/mido-guard/$version")"
          if [ "$status" = "200" ]; then
            echo "mido-guard $version is already on crates.io — nothing to publish"
            exit 0
          fi
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

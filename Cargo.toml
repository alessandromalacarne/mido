[package]
name = "mido"
version = "0.1.0"
edition = "2021"
description = "Guardrails runner: the six-gate verification ladder described by .guardrails.toml"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
